const BRANDS = [
  ["formula", "Formula", "https://tv.formula.ge/", "https://formulanews.ge/uploads_script3/articles/2021/06/30/ijmyy781nsdky1k.jpg", "An independent Georgian broadcaster covering news and current affairs on television and online.", "Visit Formula"],
  ["mindset", "Mindset", "#case-mindset-with-mindia", "https://yt3.googleusercontent.com/wW7kQdW2tJQnSgGNnPRA0s138UMHSxy3b5YWRR2x_dctDvpryKWBxqdX9iryO20BgQpsTXSp1Q=s900-c-k-c0x00ffffff-no-rj", "A Georgian-language podcast about psychology and personal growth, hosted by Mindia.", "View Mindset case study"],
  ["sasha-katsman", "Sasha Katsman", "#case-audio-course-campaigns", "https://media.stapilo.com/katsman/images/8cb0dd95-1da8-424b-bb0e-58fd52009343/original.jpg", "An entrepreneur, mentor, and speaker who offers courses and consultations on personal and professional development.", "View Sasha Katsman case study"],
  ["holy-motors", "Holy Motors", "https://holymotors.com/", "https://holymotors.com/images/holymotors-share.png", "A Tbilisi creative studio working across brand strategy, visual identity, campaigns, and digital design.", "Visit Holy Motors"]
];

const aboutProjects = PROJECTS.slice(0, 3);
const workProjects = PROJECTS.slice(3).reverse();

const $ = selector => document.querySelector(selector);
const view = $("#view");
const home = view.innerHTML;
const escapeHtml = value => String(value).replace(/[&<>"]/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
}[char]));

function projectTiles(projects) {
  return projects.map((project, index) => `
    <a class="tile" href="#case-${project.id}" style="--card-index:${index}">
      ${project.cover
        ? `<div class="art art-photo"><img src="${escapeHtml(project.cover)}" alt="" width="720" height="563" loading="lazy" decoding="async"></div>`
        : `<div class="art" aria-hidden="true">${escapeHtml(project.art)}</div>`}
      <p class="tile-category">${escapeHtml(project.category)}</p>
      <h2>${escapeHtml(project.title)}</h2>
      <p>${escapeHtml(project.summary)}</p>
    </a>`).join("");
}

function work() {
  const categories = [...new Set(workProjects.map(project => project.category))];
  return `<section class="page in">
    <h1>Projects</h1>
    <p class="intro">Brand campaigns, website copy, and creative projects. <a class="featured-link" href="#about-projects">See paid media and podcast projects</a>.</p>
    <div class="project-filters" role="group" aria-label="Filter projects by category">
      <button class="project-filter" type="button" data-project-filter="" aria-pressed="true" aria-controls="project-grid">All projects</button>
      ${categories.map(category => `<button class="project-filter" type="button" data-project-filter="${escapeHtml(category)}" aria-pressed="false" aria-controls="project-grid">${escapeHtml(category)}</button>`).join("")}
    </div>
    <p class="project-count" role="status">${workProjects.length} projects</p>
    <div class="grid project-grid" id="project-grid">${projectTiles(workProjects)}</div>
  </section>`;
}

function caseVideo(src, title, portrait) {
  const className = portrait ? "case-video case-video--portrait" : "case-video";
  return `<iframe class="${className}" src="${escapeHtml(src)}" title="${escapeHtml(title)}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
}

function projectVideoGallery(project) {
  const previews = project.youtubeVideos.map((id, index) => {
    const label = `${project.title} video ${index + 1}`;
    const source = project.videos?.[index];
    const player = source
      ? `<video class="case-video" src="${escapeHtml(source)}" aria-label="${escapeHtml(label)}" controls playsinline preload="metadata"></video>`
      : `${caseVideo(`https://www.youtube.com/embed/${id}`, label)}
        <a href="https://www.youtube.com/watch?v=${id}">Watch on YouTube</a>`;
    return `<button class="project-video-preview" type="button" aria-label="Enlarge ${escapeHtml(label)}" aria-haspopup="dialog" data-video-preview>
      <img src="${escapeHtml(project.videoThumbnails[index])}" alt="" width="960" height="704" loading="lazy" decoding="async">
      <span aria-hidden="true">⤢</span>
    </button><template>${player}</template>`;
  }).join("");
  return `<section class="case-section">
    <h2>Project videos</h2>
    <div class="project-videos">${previews}</div>
    <dialog class="project-video-dialog" aria-labelledby="project-video-title">
      <header>
        <h2 id="project-video-title"></h2>
        <form method="dialog"><button type="submit" autofocus>Close</button></form>
      </header>
      <div data-video-player></div>
    </dialog>
  </section>`;
}

function caseStudy(project, section) {
  const backLabel = section === "about" ? "About" : "Projects";
  const results = project.results.map(([value, label]) =>
    `<div class="stat"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`
  ).join("");
  const gallery = (project.gallery ?? []).map(([src, width, height, alt]) => {
    const image = `<img src="${escapeHtml(src)}" width="${width}" height="${height}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async">`;
    return project.galleryStrip
      ? `<a href="${escapeHtml(src)}" target="_blank" rel="noopener" aria-label="Open full-size photo in a new tab: ${escapeHtml(alt)}">${image}</a>`
      : image;
  }).join("");
  return `<article class="page case-study in">
    <a class="back-link" href="#${section}"><span aria-hidden="true">←</span> Back to ${backLabel}</a>
    <div class="case-heading">
      <p class="case-category">${escapeHtml(project.category)}</p>
      <h1>${escapeHtml(project.title)}</h1>
      ${project.original ? `<p class="project-original" lang="${project.id === "megreels" ? "xmf" : "ka"}">${escapeHtml(project.original)}</p>` : ""}
      <p class="case-summary">${escapeHtml(project.summary)}</p>
      <p class="meta"><span>My role <b>${escapeHtml(project.role)}</b></span></p>
    </div>
    ${results ? `<section class="case-section"><h2>Project results</h2><div class="stats">${results}</div></section>` : ""}
    ${project.videoEmbed ? `<div class="case-cover">${caseVideo(project.videoEmbed, project.title + (project.closingVideoEmbed ? " video 1" : " campaign video"), project.portraitVideo)}</div>`
      : project.cover ? `<div class="case-cover"><img src="${escapeHtml(project.cover)}" width="720" height="563" alt="${escapeHtml(project.title)} project cover" decoding="async"></div>` : ""}
    <section class="case-section cols"><h2>The goal</h2><p>${escapeHtml(project.brief)}</p></section>
    <section class="case-section cols"><h2>What I worked on</h2><p>${escapeHtml(project.work)}</p></section>
    ${project.youtubeVideos ? projectVideoGallery(project) : ""}
    ${project.closingVideoEmbed ? `<section class="case-section">
      <h2>${project.videoEmbed ? `More from ${escapeHtml(project.title)}` : "Project video"}</h2>
      ${caseVideo(project.closingVideoEmbed, project.title + (project.videoEmbed ? " video 2" : " project video"), project.portraitVideo)}
    </section>` : ""}
    ${gallery ? `<section class="case-section project-gallery">
      <h2>${project.galleryStrip ? "Behind the scenes" : "Project visuals"}</h2>
      ${project.galleryStrip ? `<p class="gallery-note"><span class="gallery-swipe">Swipe to browse. </span>Select a photo to open it full size.</p>` : ""}
      <div class="project-media${project.galleryStrip ? " project-media--strip" : ""}">${gallery}</div>
    </section>` : ""}
    ${project.showProjectLinks === false ? "" : `<div class="case-section next">
      ${project.link ? `<a class="btn" href="${escapeHtml(project.link[1])}">${escapeHtml(project.link[0])}</a>` : ""}
      <a class="more-work" href="#work">More projects</a>
    </div>`}
  </article>`;
}

function about() {
  const brands = BRANDS.map(([id, name, , image], index) => `
    <a class="brand-card" href="#brand-${id}" style="--card-index:${index}">
      <img src="${escapeHtml(image)}" alt="" width="400" height="300" loading="lazy" decoding="async">
      <span class="brand-name">${escapeHtml(name)}<span aria-hidden="true">↗</span></span>
    </a>`).join("");
  const featuredLinks = aboutProjects.map(project =>
    `<li><a href="#case-${project.id}">${escapeHtml(project.title)}</a></li>`
  ).join("");
  return `<section class="page in">
    <div class="bio">
      <h1>About me</h1>
      <p>I’m Goga Dzidziguri, a marketing strategist based in Georgia. Over the past eight years, I’ve worked across paid media, social media and copywriting, with a focus on Georgian-speaking audiences.</p>
      <p>My work spans Meta campaigns, podcast launches and the content that supports them, from the first hook to the follow-up ad.</p>
      <h2>What I do</h2>
      <ul>
        <li>Meta Ads campaign planning, testing and reporting</li>
        <li>Social content and podcast distribution across Facebook, Instagram and YouTube</li>
        <li>Copywriting for ads, landing pages and social media</li>
      </ul>
    </div>
    <section id="brands" class="brands" tabindex="-1" aria-labelledby="brands-title">
      <h2 id="brands-title">Brands</h2>
      <p class="intro">A selection of brands and organizations I’ve worked with.</p>
      <div class="grid brands-grid">${brands}</div>
      <section id="about-projects" class="about-projects" tabindex="-1" aria-labelledby="about-projects-title">
        <h3 id="about-projects-title">Paid media &amp; podcasts</h3>
        <ul>${featuredLinks}</ul>
      </section>
    </section>
    <div class="next"><a class="btn" href="#work">View projects</a></div>
    <section id="contact" class="contact" tabindex="-1" aria-labelledby="contact-title">
      <h2 id="contact-title">Get in touch</h2>
      <div class="contact-links">
        <div class="email-copy">
          <span>${EMAIL}</span>
          <button type="button" class="copy-email" data-copy-email aria-label="Copy email address" title="Copy email address">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="8" y="8" width="12" height="12" rx="2"/>
              <path d="M16 4H6a2 2 0 0 0-2 2v10"/>
            </svg>
          </button>
        </div>
        <a class="contact-social" href="https://www.instagram.com/goggadzidziguri/">Instagram</a>
      </div>
      <p class="copy-status" role="status"></p>
    </section>
  </section>`;
}

function brandPage([, name, href, image, description, linkLabel]) {
  return `<article class="page in">
    <a class="back-link" href="#brands"><span aria-hidden="true">←</span> Back to Brands</a>
    <h1>${escapeHtml(name)}</h1>
    <div class="brand-page-content">
      <img class="brand-page-image" src="${escapeHtml(image)}" alt="" width="400" height="300" decoding="async">
      <div class="brand-page-description">
        <p>${escapeHtml(description)}</p>
        <a class="btn" href="${escapeHtml(href)}">${escapeHtml(linkLabel)}</a>
      </div>
    </div>
  </article>`;
}

function route(moveFocus = false) {
  const hash = location.hash.slice(1);
  const project = PROJECTS.find(item => hash === "case-" + item.id);
  const brand = BRANDS.find(([id]) => hash === "brand-" + id);
  const aboutAnchor = ["brands", "about-projects", "contact"].includes(hash);
  let page = "home";
  let title = "Marketing Strategist";
  let markup = home;

  if (project) {
    page = aboutProjects.includes(project) ? "about" : "work";
    title = project.title;
    markup = caseStudy(project, page);
  } else if (hash === "work" || hash.startsWith("work-") || hash.startsWith("case-")) {
    page = "work";
    title = "Projects";
    markup = work();
  } else if (brand) {
    page = "about";
    title = brand[1];
    markup = brandPage(brand);
  } else if (hash === "about" || aboutAnchor) {
    page = "about";
    title = "About";
    markup = about();
  }

  document.body.classList.toggle("home", page === "home");
  view.innerHTML = markup;
  document.title = `${title} | Goga Dzidziguri`;
  document.querySelectorAll("[data-nav]").forEach(link => {
    if (link.dataset.nav === page) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  if (aboutAnchor) {
    const target = $("#" + hash);
    if (moveFocus) target.focus({preventScroll: true});
    target.scrollIntoView();
  } else if (moveFocus) {
    $("#main").focus({preventScroll: true});
    window.scrollTo(0, 0);
  }
}

$(".skip").addEventListener("click", event => {
  event.preventDefault();
  $("#main").focus();
});
view.addEventListener("click", event => {
  const button = event.target.closest("[data-project-filter]");
  if (!button || button.getAttribute("aria-pressed") === "true") return;

  const category = button.dataset.projectFilter;
  const matches = category ? workProjects.filter(project => project.category === category) : workProjects;
  button.closest(".project-filters").querySelectorAll("button").forEach(filter => {
    filter.setAttribute("aria-pressed", String(filter === button));
  });
  $("#project-grid").innerHTML = projectTiles(matches);
  $(".project-count").textContent = matches.length === 1 ? "1 project" : `${matches.length} projects`;
});
view.addEventListener("click", async event => {
  const button = event.target.closest("[data-copy-email]");
  if (!button) return;
  const status = button.closest(".contact").querySelector(".copy-status");
  try {
    await navigator.clipboard.writeText(EMAIL);
    status.textContent = "Email address copied.";
  } catch {
    status.textContent = "Select the email address to copy it.";
  }
});
view.addEventListener("click", event => {
  const preview = event.target.closest("[data-video-preview]");
  if (!preview) return;

  const dialog = preview.closest(".case-section").querySelector("dialog");
  const player = dialog.querySelector("[data-video-player]");
  player.replaceChildren(preview.nextElementSibling.content.cloneNode(true));
  dialog.querySelector("h2").textContent = player.firstElementChild.getAttribute("title") ?? player.firstElementChild.getAttribute("aria-label");
  dialog.addEventListener("close", () => {
    player.replaceChildren();
    preview.focus();
  }, {once: true});
  dialog.showModal();
});
window.addEventListener("hashchange", () => route(true));
route();
</script>
