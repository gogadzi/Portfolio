<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goga Dzidziguri | Marketing Strategist</title>
<meta name="description" content="Goga Dzidziguri, a marketing strategist with eight years of experience in paid media, social growth and copywriting. View selected work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Outfit:wght@500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#1A1A1A;--mute:#767676;--line:#E8E8E8;--acc:#1A1A1A;--onacc:#FFFFFF;--card:#FAFAFA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14132B;--ink:#ECEBF5;--mute:#A3A2C8;--line:#2E2D55;--acc:#8C8CFF;--onacc:#14132B;--card:#1C1B3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14132B;--ink:#ECEBF5;--mute:#A3A2C8;--line:#2E2D55;--acc:#8C8CFF;--onacc:#14132B;--card:#1C1B3A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.02;margin:0;letter-spacing:-.025em}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.03em}
header nav{display:flex;gap:28px;align-items:center}
main{min-height:70vh;padding:56px 0 96px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 36px}
.filters a{display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:6px 16px;text-decoration:none;font-weight:500;font-size:15px}
.filters a[aria-current]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px}
.tile{text-decoration:none;display:block}
.tile .art{aspect-ratio:4/3;border-radius:0;display:flex;align-items:flex-end;padding:18px;color:#17163A;font:800 clamp(28px,3vw,40px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;transition:transform .2s}
.tile:hover .art{transform:translateY(-4px)}
.tile h2{font-size:22px;margin:14px 0 2px;font-weight:700}
.tile p{margin:0;color:var(--mute);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px 32px;color:var(--mute);margin:0 0 40px}
.meta b{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:200px 1fr;gap:12px 40px;padding:28px 0;border-top:1px solid var(--line)}
.cols h2{font-size:22px;font-weight:700}
.cols p{margin:0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 20px;min-width:150px}
.stat b{display:block;font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.stat span{color:var(--mute);font-size:15px}
.next{margin-top:56px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--acc);color:var(--onacc);font:700 16px "DM Sans",sans-serif;padding:14px 26px;border-radius:4px;text-decoration:none;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:15px}
footer .wrap{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 32px}
body.home::before{display:none}
body.home header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;background:transparent;border-bottom:0;color:#fff}
body.home header a{color:#fff}
body.home main{padding:0;min-height:0}
body.home main .wrap{max-width:none;padding:0}
.landing{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:96px 5vw 9vh;color:#FFF3A0;overflow:hidden;background:radial-gradient(ellipse 45% 30% at 62% 26%,#0E1013 0%,rgba(14,16,19,0) 100%),radial-gradient(ellipse 70% 50% at 55% 62%,rgba(86,118,155,.7) 0%,rgba(86,118,155,0) 100%),linear-gradient(180deg,#15181D 0%,#1E2A3A 45%,#46627F 100%)}
.landing.bg-teal{background:radial-gradient(circle at 76% 36%,transparent 15vw,rgba(125,225,200,.28) 15.6vw,transparent 26vw),radial-gradient(ellipse 60% 45% at 76% 36%,rgba(6,18,17,.85) 0%,rgba(6,18,17,0) 100%),linear-gradient(180deg,#081715 0%,#12423E 55%,#2C7A70 100%)}
.landing>*{position:relative;z-index:1}
.blurb{margin-left:62%;max-width:38ch;font:400 clamp(16px,1.3vw,20px)/1.55 "DM Sans",sans-serif}
.blurb p{margin:0}
.blurb .role{font-size:clamp(18px,2.2vw,30px);font-weight:700;margin-bottom:12px}
.landing h1{font:500 clamp(48px,9vw,160px)/.95 Outfit,sans-serif;letter-spacing:-.045em;margin-top:3vh}
.in{animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

nav a{font:500 16px "DM Sans",system-ui,sans-serif;text-decoration:none;padding:8px 0}
nav a:hover,nav a[aria-current]{text-decoration:underline;text-underline-offset:6px}
.bar{gap:16px}
body.home header :focus-visible,.landing :focus-visible{outline-color:#FFF3A0}
.landing{padding-bottom:max(7vh,calc(env(safe-area-inset-bottom,0px) + 24px))}
.landing-cta{margin-top:22px}
.landing-cta .btn{background:#FFF3A0;color:#102E2B}
.page h1{font-size:clamp(32px,6vw,64px);margin:0 0 22px;line-height:1.06}
.page .intro,.bio{max-width:64ch}
.intro{color:var(--mute);margin:0 0 30px}
.page :is(a,button){overflow-wrap:anywhere}
.bio h2{font-size:24px;margin-top:36px}
.bio ul{padding-left:20px}
.tile .art{overflow-wrap:anywhere}
.skip{position:fixed;top:12px;left:12px;z-index:40;transform:translateY(-150%);background:var(--bg);color:var(--ink);padding:10px}
.skip:focus{transform:none}
#main:focus{outline:none}
@media (max-width:760px){
  .wrap{padding-inline:18px}
  header nav{gap:20px}
  .blurb{margin-left:0;max-width:38ch}
  .cols{grid-template-columns:1fr;gap:12px}
  .landing h1{font-size:clamp(44px,14vw,90px)}
  .landing{padding-inline:18px}
}
@media (max-width:370px){
  .logo{font-size:16px}
  header nav{gap:12px}
}
</style>
</head>
<body class="home">
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="wrap bar">
    <a class="logo" href="#home">Goga Dzidziguri</a>
    <nav aria-label="Main">
      <a href="#work" data-nav="work">Work</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1">
  <div class="wrap" id="view">
    <section class="landing bg-teal">
      <div class="blurb">
        <p class="role">Marketing strategist</p>
        <p>Eight years in marketing, focused on paid media, social growth and copywriting.</p>
      </div>
      <h1>Goga Dzidziguri</h1>
      <div class="landing-cta"><a class="btn" href="#work">View selected work</a></div>
    </section>
  </div>
  <noscript><p class="wrap">Enable JavaScript to browse the work and about pages.</p></noscript>
</main>
<footer><div class="wrap"><span>© 2026 Goga Dzidziguri</span><span id="footer-links" hidden></span></div></footer>
<script>
// Fill in these details when they are ready. Empty values stay hidden.
const PROFILE = { email: "", linkedin: "", resume: "" };

const FOLDERS = {campaigns: "Campaigns", social: "Social growth", content: "Content and copy"};
const PROJECTS = [
  {
    id: "mindset-with-mindia", title: "Mindset with Mindia", folder: "social",
    role: "Social media, copy and reporting", color: "#F2E85C", art: "60K+",
    summary: "Growing the Facebook audience for a Georgian-language psychology podcast.",
    brief: "Build a Georgian audience for a psychology podcast and give people a reason to watch full episodes.",
    work: "I worked on short clips, episode announcements and platform-specific copy. The weekly YouTube episodes gave us a steady source of material for Facebook.",
    results: [["60K+", "Facebook followers at the reported milestone"], ["2.5M", "Facebook views in one 28-day reporting period"]],
    link: ["Watch Mindset with Mindia", "https://www.youtube.com/@MindsetwithMindia"]
  },
  {
    id: "audio-course-campaigns", title: "Sasha Katsman Audiocourses", folder: "campaigns",
    role: "Meta Ads and campaign copy", color: "#9BE3C4", art: "Meta Ads",
    summary: "Awareness and sales campaigns for two Georgian-language audio courses.",
    brief: "Introduce two courses to cold audiences and give interested viewers a path to purchase.",
    work: "I built separate messaging for the business and personal development courses, adapted the creative for awareness and sales, and set up UTMs and retargeting audiences.",
    results: [],
    link: ["View the business course", "https://www.sashakatsman.com/ka-ge/audiocourseforbusiness"]
  },
  {
    id: "katsman-business-podcast", title: "Katsman Business Podcast", folder: "content",
    role: "Podcast copy and sponsor materials", color: "#B9B6FF", art: "23K",
    summary: "Episode promotion and sponsor materials for a Georgian business podcast.",
    brief: "Help audiences discover new episodes and make sponsor placements clear and consistent.",
    work: "I wrote promotional copy for episodes and worked on sponsor materials for announcements, thumbnails and in-episode integrations.",
    results: [["23K", "Podcast followers across its first nine episodes"]]
  }
];

const $ = selector => document.querySelector(selector);
const view = $("#view");
const home = view.innerHTML;
const escapeHtml = value => String(value).replace(/[&<>"]/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
}[char]));

function profileLinks() {
  const links = [
    PROFILE.email && `<a href="mailto:${escapeHtml(PROFILE.email)}">Email</a>`,
    PROFILE.linkedin && `<a href="${escapeHtml(PROFILE.linkedin)}">LinkedIn</a>`,
    PROFILE.resume && `<a href="${escapeHtml(PROFILE.resume)}">Résumé</a>`
  ];
  return links.filter(Boolean).join(" · ");
}

function work(folder) {
  const list = folder ? PROJECTS.filter(project => project.folder === folder) : PROJECTS;
  const filters = [["", "All"], ...Object.entries(FOLDERS)].map(([key, label]) =>
    `<a href="#work${key ? "-" + key : ""}"${key === folder ? ' aria-current="page"' : ""}>${label}</a>`
  ).join("");
  const tiles = list.map(project => `
    <a class="tile" href="#case-${project.id}">
      <div class="art" style="background:${project.color}" aria-hidden="true">${escapeHtml(project.art)}</div>
      <h2>${escapeHtml(project.title)}</h2>
      <p>${escapeHtml(project.summary)}</p>
    </a>`).join("");
  return `<section class="page in">
    <h1>Selected work</h1>
    <p class="intro">Paid campaigns, podcast growth and copywriting.</p>
    <nav class="filters" aria-label="Filter projects">${filters}</nav>
    <div class="grid">${tiles}</div>
  </section>`;
}

function caseStudy(project) {
  const results = project.results.map(([value, label]) =>
    `<div class="stat"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`
  ).join("");
  return `<article class="page in">
    <p><a href="#work-${project.folder}">← ${FOLDERS[project.folder]}</a></p>
    <h1>${escapeHtml(project.title)}</h1>
    <p class="meta"><span>My role <b>${escapeHtml(project.role)}</b></span></p>
    ${results ? `<section class="cols"><h2>Project results</h2><div class="stats">${results}</div></section>` : ""}
    <section class="cols"><h2>The goal</h2><p>${escapeHtml(project.brief)}</p></section>
    <section class="cols"><h2>What I worked on</h2><p>${escapeHtml(project.work)}</p></section>
    <div class="next">
      ${project.link ? `<a class="btn" href="${escapeHtml(project.link[1])}">${escapeHtml(project.link[0])}</a>` : ""}
      <a href="#work">All projects</a>
    </div>
  </article>`;
}

function about() {
  return `<section class="page bio in">
    <h1>About me</h1>
    <p>I’m Goga Dzidziguri, a marketing strategist based in Georgia. Over the past eight years, I’ve worked across paid media, social media and copywriting, with a focus on Georgian-speaking audiences.</p>
    <p>My work spans Meta campaigns, podcast launches and the content that supports them, from the first hook to the follow-up ad.</p>
    <h2>What I do</h2>
    <ul>
      <li>Meta Ads campaign planning, testing and reporting</li>
      <li>Social content and podcast distribution across Facebook, Instagram and YouTube</li>
      <li>Copywriting for ads, landing pages and social media</li>
    </ul>
    <div class="next"><a class="btn" href="#work">View selected work</a></div>
  </section>`;
}

function route(moveFocus = false) {
  const hash = location.hash.slice(1);
  const project = PROJECTS.find(item => hash === "case-" + item.id);
  const filter = hash.startsWith("work-") ? hash.slice(5) : "";
  let page = "home";
  let title = "Marketing Strategist";
  let markup = home;

  if (project) {
    page = "work";
    title = project.title;
    markup = caseStudy(project);
  } else if (hash === "work" || hash.startsWith("work-") || hash.startsWith("case-")) {
    page = "work";
    title = "Selected Work";
    markup = work(Object.hasOwn(FOLDERS, filter) ? filter : "");
  } else if (hash === "about" || hash === "contact") {
    page = "about";
    title = "About";
    markup = about();
  }

  document.body.classList.toggle("home", page === "home");
  view.innerHTML = markup;
  document.title = `${title} | Goga Dzidziguri`;
  document.querySelectorAll("[data-nav]").forEach(link => {
    if (link.dataset.nav === page) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  if (moveFocus) {
    $("#main").focus({preventScroll: true});
    window.scrollTo(0, 0);
  }
}

const links = profileLinks();
if (links) {
  $("#footer-links").innerHTML = links;
  $("#footer-links").hidden = false;
}
$(".skip").addEventListener("click", event => {
  event.preventDefault();
  $("#main").focus();
});
window.addEventListener("hashchange", () => route(true));
route();
</script>
</body>
</html>
